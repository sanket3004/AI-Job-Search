<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Toolkit test application · Local simulation</title>
<style>body{max-width:650px;margin:50px auto;font:16px system-ui;padding:20px;color:#243d31}label{display:block;margin:22px 0}input,select{display:block;padding:10px;width:100%;box-sizing:border-box;margin-top:8px}button{padding:12px 20px;background:#264e38;color:white;border:0;border-radius:6px}.notice{background:#f0f3e9;padding:20px}#review{display:none}</style>
<h1>Local application simulation</h1><p class="notice">Synthetic employer: Example Labs. No information leaves this local page. This fixture tests filling and the review stop.</p>
<form id="application"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Work arrangement<select name="arrangement" required><option value="">Select an option</option><option>Remote</option><option>Hybrid</option></select></label><label>Resume (optional for this simulation)<input name="resume" type="file" accept=".txt,.pdf,.docx"></label><button type="submit">Review application</button></form>
<section id="review"><h2>Review before submitting</h2><pre id="answers"></pre><p>All required fields passed local validation. Submission has not occurred.</p><button id="submit">Submit test application</button></section>
<script>document.querySelector('#application').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);document.querySelector('#answers').textContent=JSON.stringify({name:data.get('name'),email:data.get('email'),arrangement:data.get('arrangement')},null,2);e.target.hidden=true;document.querySelector('#review').style.display='block';});document.querySelector('#submit').addEventListener('click',()=>{document.querySelector('#review').textContent='Synthetic application received. Receipt TEST-001.';});</script></html>
